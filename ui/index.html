<!doctype html>
<html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>UGOS - USB Wi-Fi</title>
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231664ff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M4.5 12a11 11 0 0 1 15 0'/%3E%3Cpath d='M7.5 15a7 7 0 0 1 9 0'/%3E%3Ccircle cx='12' cy='18.5' r='1.3' fill='%231664ff' stroke='none'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1d2129;--muted:#8a94a6;--line:#e8eaed;--fill:#f5f6f8;--primary:#1664ff;--primary-bg:#eaf2ff;--ok:#00b42a;--ok-bg:#e8ffea;--warn:#ff7d00;--warn-bg:#fff7e8;--err:#f53f3f;--err-bg:#ffece8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif}
main{max-width:980px;margin:0 auto;padding:22px 16px 48px;display:grid;gap:16px}
@media (min-width:800px){main{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
header{display:flex;align-items:center;gap:10px}
header h1{font-size:19px;font-weight:600;margin:0;flex:1}
header .logo{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px}
.card{background:var(--card);border-radius:12px;padding:16px 20px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,30,60,.04),0 2px 8px rgba(20,30,60,.04)}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kv div{background:var(--fill);border-radius:8px;padding:8px 12px}
.kv b{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted);font-size:12px}
.tag{font-size:12px;padding:1px 9px;border-radius:10px;background:var(--fill);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.err{background:var(--err-bg);color:var(--err)}
button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;background:var(--card);color:var(--text)}
button:hover{background:var(--fill)}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.primary:hover{filter:brightness(1.05);background:var(--primary)}
button.danger{background:var(--card);color:var(--err);border-color:var(--err-bg)}
button.danger:hover{background:var(--err-bg)}
input{font:inherit;color:inherit;background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:100%}
input:focus{outline:0;border-color:var(--primary);background:var(--card)}
form{display:grid;gap:10px}
form .line{display:grid;grid-template-columns:1fr 90px;gap:10px}
label{font-size:12px;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:15px}
.bars i{width:4px;border-radius:1px;background:var(--line)}
.bars i.on{background:var(--primary)}
.big{font-size:20px;font-weight:600;margin:0 0 12px}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.sub{color:var(--muted);font-size:12px;margin:-6px 0 2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.show{opacity:1}
</style></head>
<body><main>
<header class=wide><span class=logo>📶</span><h1 data-t=title></h1><button id=lang onclick="toggleLang()"></button></header>

<section class="card wide"><h2 data-t=connection></h2><div id=conn></div></section>

<section class="card wide"><h2><span data-t=nearby></span><small id=scanN></small></h2>
<p class=sub data-t=nearby_hint></p><div id=scan></div></section>

<section class=card><h2 data-t=saved></h2><div id=saved></div></section>

<section class=card><h2 data-t=add></h2>
<form id=f onsubmit="event.preventDefault();save()">
<div><label data-t=ssid></label><input id=s list=near required maxlength=32></div>
<div class=line><div><label data-t=password></label><input id=p type=password minlength=8 maxlength=63 required></div>
<div><label data-t=priority></label><input id=r type=number min=0 max=999 value=5></div></div>
<button class=primary data-t=save></button></form><datalist id=near></datalist></section>

<section class="card wide"><h2><span data-t=adapter></span><small id=kernel></small></h2><div id=hw></div></section>

<section class="card wide"><h2><span data-t=available></span><small id=availk></small></h2>
<p class=sub data-t=available_hint></p><div id=avail></div></section>
</main><div id=toast></div>
<script>
const T={en:{title:'UGOS - USB Wi-Fi',connection:'Connection',adapter:'Plugged USB adapter',saved:'Saved networks',add:'Add or update a network',ssid:'Network name (SSID)',password:'Password',priority:'Priority',save:'Save',nearby:'Nearby networks',nearby_hint:'Networks the NAS can see right now. Tap “Use” to fill the form below.',connected:'Connected',disconnected:'Not connected',noiface:'No Wi-Fi interface. Plug in a supported USB adapter.',iface:'Interface',ip:'IP address',signal:'Signal',band:'Band',rate:'Speed',service:'Service',none:'None',delete:'Delete',confirm:'Confirm?',use:'Use',nohw:'No USB Wi-Fi adapter detected.',ok:'Working',driver:'Driver available, no interface',unsupported:'No driver',port:'Port',id:'USB ID',drv:'Driver',fw:'Firmware',loaded:'loaded',notloaded:'not loaded',nofw:'not needed',kernel:'Kernel',saved_ok:'Saved, reconnecting…',deleted:'Deleted, reconnecting…',restarting:'Reconnecting…',empty:'Nothing yet.',scan_empty:'No networks found nearby.',found:'seen',available:'Drivers available on this NAS',available_hint:'Chipsets this kernel can already drive — a safe shopping list, no device needed.',ready:'Ready',fw_missing:'Firmware missing',not_in_kernel:'Not in this kernel',examples:'e.g.',lan:'Access denied. This app only works from your local network.',login_title:'Sign in to USB Wi-Fi',signin:'Sign in',wrong:'Wrong password',locked:'Too many attempts. Wait a few minutes.'},
fr:{title:'UGOS - USB Wi-Fi',connection:'Connexion',adapter:'Adaptateur USB branché',saved:'Réseaux enregistrés',add:'Ajouter ou modifier un réseau',ssid:'Nom du réseau (SSID)',password:'Mot de passe',priority:'Priorité',save:'Enregistrer',nearby:'Réseaux à proximité',nearby_hint:'Réseaux visibles par le NAS en ce moment. Touchez « Utiliser » pour remplir le formulaire ci-dessous.',connected:'Connecté',disconnected:'Non connecté',noiface:'Aucune interface Wi-Fi. Branchez un adaptateur USB compatible.',iface:'Interface',ip:'Adresse IP',signal:'Signal',band:'Bande',rate:'Débit',service:'Service',none:'Aucun',delete:'Supprimer',confirm:'Confirmer ?',use:'Utiliser',nohw:'Aucun adaptateur Wi-Fi USB détecté.',ok:'Fonctionne',driver:'Pilote présent, pas d’interface',unsupported:'Aucun pilote',port:'Port',id:'ID USB',drv:'Pilote',fw:'Firmware',loaded:'chargé',notloaded:'non chargé',nofw:'non requis',kernel:'Noyau',saved_ok:'Enregistré, reconnexion…',deleted:'Supprimé, reconnexion…',restarting:'Reconnexion…',empty:'Rien pour l’instant.',scan_empty:'Aucun réseau détecté à proximité.',found:'vus',available:'Pilotes disponibles sur ce NAS',available_hint:'Chipsets que ce noyau sait déjà piloter — une liste d’achat sûre, sans appareil branché.',ready:'Prête',fw_missing:'Firmware manquant',not_in_kernel:'Absent de ce noyau',examples:'ex. :',lan:'Accès refusé. Cette appli ne fonctionne que depuis votre réseau local.',login_title:'Connexion à Wi-Fi USB',signin:'Se connecter',wrong:'Mot de passe incorrect',locked:'Trop de tentatives. Patientez quelques minutes.'}};
const L=(localStorage.getItem('LANG')||navigator.language||'').replace(/"/g,'').toLowerCase().startsWith('fr')?'fr':'en',t=k=>T[L][k];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.title=t('title');
if($('lang'))$('lang').textContent=L=='fr'?'English':'Français';
function toggleLang(){localStorage.setItem('LANG',L=='fr'?'en':'fr');location.reload()}
const bars=dbm=>{const n=dbm>=-55?4:dbm>=-65?3:dbm>=-75?2:1;return '<span class=bars>'+[7,10,13,15].map((h,i)=>`<i style="height:${h}px" class="${i<n?'on':''}"></i>`).join('')+'</span>'};
const kv=o=>'<div class=kv>'+Object.entries(o).map(([k,v])=>`<div><b>${esc(t(k))}</b>${v}</div>`).join('')+'</div>';
let current=null;
async function api(path,opts={}){
  const r=await fetch('api/'+path,opts);
  if(r.status==401&&path!='login'){showLogin();throw new Error(401)}
  if(r.status==403){document.querySelector('main').innerHTML=`<section class="card wide"><div class=empty>${t('lan')}</div></section>`;throw new Error(403)}
  return r;
}
function showLogin(){if($('pw'))return;document.querySelector('main').innerHTML=`<section class="card wide" style="max-width:360px;margin:10vh auto"><h2>${t('login_title')}</h2><form onsubmit="event.preventDefault();login()"><input id=pw type=password autofocus placeholder="${t('password')}"><button class=primary style="margin-top:10px">${t('signin')}</button></form><p style="text-align:center;margin:14px 0 0"><button onclick="toggleLang()" style="padding:4px 10px">${L=='fr'?'English':'Français'}</button></p></section>`}
async function login(){const r=await api('login',{method:'POST',body:JSON.stringify({password:$('pw').value})});if(r.ok)return location.reload();toast(r.status==429?t('locked'):t('wrong'));$('pw').select()}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2500)}
async function load(){
  const d=await(await api('status')).json(),x=d.status;current=x.ssid;
  $('conn').innerHTML=!x.iface?`<div class=empty>${t('noiface')}</div>`:
    `<p class=big>${x.ssid?bars(x.signal)+' '+esc(x.ssid):t('disconnected')} <span class="tag ${x.ssid?'ok':'warn'}">${t(x.ssid?'connected':'disconnected')}</span></p>`+
    kv({iface:esc(x.iface),ip:esc(x.ip||'–'),signal:x.signal!=null?x.signal+' dBm':'–',band:x.freq?(x.freq>5900?'6 GHz':x.freq>4900?'5 GHz':'2,4 GHz'):'–',rate:esc(x.rate||'–'),service:`<span class="tag ${x.service=='active'?'ok':'err'}">${esc(x.service)}</span>`});
  $('scanN').textContent=d.scan.length?d.scan.length+' '+t('found'):'';
  $('scan').innerHTML=d.scan.length?d.scan.map(n=>`<div class=row>${bars(n.signal)}<span class=main><b>${esc(n.ssid)}</b></span><span class=muted>${n.signal} dBm</span><button data-ssid="${esc(n.ssid)}" onclick="use(this)">${t('use')}</button></div>`).join(''):`<div class=empty>${t('scan_empty')}</div>`;
  $('saved').innerHTML=d.networks.length?d.networks.map(n=>`<div class=row><span class=main>${esc(n.ssid)}</span>${n.ssid==current?`<span class="tag ok">${t('connected')}</span>`:''}<span class=tag>${t('priority')} ${n.priority}</span><button class=danger data-ssid="${esc(n.ssid)}" onclick="del(this)">${t('delete')}</button></div>`).join(''):`<div class=empty>${t('empty')}</div>`;
  $('near').innerHTML=d.scan.map(n=>`<option value="${esc(n.ssid)}">`).join('');
}
async function loadHw(){
  const d=await(await api('hardware')).json(),tag={ok:'ok',driver:'warn',unsupported:'err'};
  $('kernel').textContent=t('kernel')+' '+d.kernel;
  $('hw').innerHTML=d.devices.length?d.devices.map(v=>`<div class=row style="display:block"><p><b>${esc(v.name||v.id)}</b> <span class="tag ${tag[v.verdict]}">${t(v.verdict)}</span></p>`+
    kv({port:esc(v.port)+'<br><span class=muted>'+esc(v.usb)+'</span>',id:esc(v.id),drv:v.module?esc(v.module)+`<br><span class=muted>${t(v.loaded?'loaded':'notloaded')}</span>`:'–',
        fw:!v.firmware?'–':v.firmware.needed?`<span class="tag ${v.firmware.found?'ok':'err'}">${v.firmware.found}/${v.firmware.needed}</span>`:t('nofw'),iface:esc(v.iface||'–')})+'</div>').join(''):`<div class=empty>${t('nohw')}</div>`;
}
async function loadAvail(){
  const d=await(await api('available')).json();
  $('availk').textContent=t('kernel')+' '+d.kernel;
  const meta={ok:['ok','ready'],missing:['warn','fw_missing'],absent:['err','not_in_kernel']},ord={ok:0,missing:1,absent:2};
  const cards=d.cards.slice().sort((a,b)=>ord[a.state]-ord[b.state]);
  $('avail').innerHTML=cards.map(c=>{const[cls,lab]=meta[c.state];return `<div class=row style="display:block"><p style="margin:0 0 3px"><b>${esc(c.chip)}</b> <span class="tag ${cls}">${t(lab)}</span> <span class=muted>${esc(c.module)}</span></p><p class=muted style="margin:0">${t('examples')} ${esc(c.examples)}</p></div>`}).join('');
}
async function post(a,b={},msg){const r=await api(a,{method:'POST',body:JSON.stringify(b)});toast(r.ok?(msg||t('restarting')):await r.text());setTimeout(load,4000)}
function save(){post('add',{ssid:$('s').value,psk:$('p').value,priority:+$('r').value},t('saved_ok'));$('p').value=''}
function del(b){if(b.dataset.armed)return post('delete',{ssid:b.dataset.ssid},t('deleted'));b.dataset.armed=1;b.textContent=t('confirm');setTimeout(()=>{delete b.dataset.armed;b.textContent=t('delete')},3000)}
function use(b){$('s').value=b.dataset.ssid;$('p').focus();$('p').scrollIntoView({behavior:'smooth',block:'center'})}
load();loadHw();loadAvail();setInterval(load,10000);setInterval(loadHw,30000);
</script></body></html>
